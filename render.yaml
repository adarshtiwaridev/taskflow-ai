services:
  - type: web
    name: taskflow-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate --schema=apps/api/prisma/schema.prisma && npm run build --workspace=@taskflow/shared && npm run build --workspace=@taskflow/api
    startCommand: npm run start --workspace=@taskflow/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_URL
        value: https://taskflow-ai-murex.vercel.app
      - key: CORS_ORIGIN
        value: https://taskflow-ai-murex.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString

databases:
  - name: taskflow-db
    databaseName: taskflow
    user: taskflow
    plan: free
    region: oregon
